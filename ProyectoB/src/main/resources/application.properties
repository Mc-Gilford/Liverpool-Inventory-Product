spring.application.name=ProyectoB
server.port=8082

# Base de datos H2 independiente
spring.datasource.url=jdbc:h2:mem:proyecto_b_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dirección del microservicio ProyectoA
inventory.service.url=http://localhost:8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always